# =============================================================================
# Macro Sign Service - Docker Compose
# =============================================================================
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose logs -f api    # View API logs
#   docker-compose down -v        # Stop and remove volumes

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # API Server
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    container_name: macro-sign-api
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_SECRET_KEY=${APP_SECRET_KEY:-dev-secret-key}
      - DATABASE_URL=postgresql+asyncpg://macrosign:macrosign@postgres:5432/macrosign
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret}
      - CERT_STORE_BACKEND=local
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000
    volumes:
      - cert-data:/app/certs
      - ./src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - macro-sign-net

  # ---------------------------------------------------------------------------
  # Celery Worker
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
    container_name: macro-sign-worker
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=postgresql+asyncpg://macrosign:macrosign@postgres:5432/macrosign
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CERT_STORE_BACKEND=local
    volumes:
      - cert-data:/app/certs
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    networks:
      - macro-sign-net

  # ---------------------------------------------------------------------------
  # Dashboard (Next.js)
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.dashboard
    container_name: macro-sign-dashboard
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - macro-sign-net

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: macro-sign-db
    environment:
      POSTGRES_DB: macrosign
      POSTGRES_USER: macrosign
      POSTGRES_PASSWORD: macrosign
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macrosign"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - macro-sign-net

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: macro-sign-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - macro-sign-net

  # ---------------------------------------------------------------------------
  # Prometheus (Monitoring)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: macro-sign-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - macro-sign-net

  # ---------------------------------------------------------------------------
  # Grafana (Dashboards)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.3.1
    container_name: macro-sign-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - macro-sign-net

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-data:
  redis-data:
  cert-data:
  prometheus-data:
  grafana-data:

# =============================================================================
# Networks
# =============================================================================
networks:
  macro-sign-net:
    driver: bridge
