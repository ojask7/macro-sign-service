global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "macro-sign-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "macro-sign-service"
          component: "api"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
