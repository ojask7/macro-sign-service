apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command:
            - celery
            - -A
            - src.queue.celery_app:celery_app
            - worker
            - --loglevel=info
            - -Q
            - {{ .Values.worker.queues }}
            - --concurrency={{ .Values.worker.concurrency }}
          env:
            - name: APP_ENV
              value: {{ .Values.api.env.APP_ENV | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" .Release.Name) }}
                  key: database-url
            - name: REDIS_URL
              value: "redis://{{ .Release.Name }}-redis-master:6379/0"
            - name: CELERY_BROKER_URL
              value: "redis://{{ .Release.Name }}-redis-master:6379/1"
            - name: CELERY_RESULT_BACKEND
              value: "redis://{{ .Release.Name }}-redis-master:6379/2"
            - name: CERT_STORE_BACKEND
              value: {{ .Values.api.env.CERT_STORE_BACKEND | quote }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
