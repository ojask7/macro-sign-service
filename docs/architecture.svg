<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="api-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="worker-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="720" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Macro Sign Service — Architecture</text>
  <text x="550" y="58" text-anchor="middle" font-size="12" fill="#64748b">SNOW Synchronous · CI/CD Async · Certificate Store · Admin Dashboard</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- CONSUMERS ZONE -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="20" y="80" width="210" height="370" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="80" width="210" height="32" rx="10" fill="#f1f5f9"/>
  <rect x="20" y="100" width="210" height="12" fill="#f1f5f9"/>
  <text x="125" y="101" text-anchor="middle" font-size="11" font-weight="600" fill="#475569" letter-spacing="1">CONSUMERS</text>

  <!-- ServiceNow box -->
  <rect x="36" y="124" width="178" height="82" rx="8" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="125" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">🌐 ServiceNow</text>
  <text x="125" y="162" text-anchor="middle" font-size="10" fill="#15803d">Business Rule /</text>
  <text x="125" y="176" text-anchor="middle" font-size="10" fill="#15803d">Script Include /</text>
  <text x="125" y="190" text-anchor="middle" font-size="10" fill="#15803d">Flow Designer Action</text>

  <!-- CI/CD box -->
  <rect x="36" y="220" width="178" height="98" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="125" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">⚙  CI/CD Pipeline</text>
  <text x="125" y="258" text-anchor="middle" font-size="10" fill="#1d4ed8">GitHub Actions</text>
  <text x="125" y="272" text-anchor="middle" font-size="10" fill="#1d4ed8">Azure DevOps</text>
  <text x="125" y="286" text-anchor="middle" font-size="10" fill="#1d4ed8">Jenkins</text>
  <text x="125" y="302" text-anchor="middle" font-size="9" fill="#3b82f6" font-style="italic">on: push / pull_request</text>

  <!-- CLI/SDK box -->
  <rect x="36" y="332" width="178" height="60" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="125" y="354" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">🖥  CLI / SDK</text>
  <text x="125" y="373" text-anchor="middle" font-size="10" fill="#7c3aed">Local dev signing</text>

  <!-- Admin Dashboard box -->
  <rect x="36" y="406" width="178" height="32" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="125" y="427" text-anchor="middle" font-size="12" font-weight="600" fill="#c2410c">📊 Admin Dashboard :3000</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- FASTAPI API (CENTER) -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="310" y="180" width="200" height="170" rx="10" fill="url(#api-grad)" filter="url(#shadow)"/>
  <text x="410" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">⚡ FastAPI</text>
  <text x="410" y="226" text-anchor="middle" font-size="11" fill="#bfdbfe">uvicorn · :8000</text>
  <line x1="330" y1="234" x2="490" y2="234" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="410" y="250" text-anchor="middle" font-size="10" fill="#dbeafe">POST /snow/sign → 200 OK</text>
  <text x="410" y="265" text-anchor="middle" font-size="10" fill="#dbeafe">POST /snow/verify</text>
  <text x="410" y="280" text-anchor="middle" font-size="10" fill="#dbeafe">POST /sign → 202 + job_id</text>
  <text x="410" y="295" text-anchor="middle" font-size="10" fill="#dbeafe">GET  /status/{job_id}</text>
  <text x="410" y="310" text-anchor="middle" font-size="10" fill="#dbeafe">POST /auth/login · /register</text>
  <text x="410" y="325" text-anchor="middle" font-size="10" fill="#dbeafe">GET  /admin/* · /webhooks</text>
  <text x="410" y="340" text-anchor="middle" font-size="10" fill="#dbeafe">JWT · API Key · RBAC</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- CELERY WORKER -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="590" y="180" width="180" height="120" rx="10" fill="url(#worker-grad)" filter="url(#shadow)"/>
  <text x="680" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">🔄 Celery Worker</text>
  <text x="680" y="226" text-anchor="middle" font-size="10" fill="#bae6fd">async signing jobs</text>
  <line x1="610" y1="234" x2="750" y2="234" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="680" y="249" text-anchor="middle" font-size="10" fill="#e0f2fe">sign_macro_task</text>
  <text x="680" y="264" text-anchor="middle" font-size="10" fill="#e0f2fe">verify_macro_task</text>
  <text x="680" y="279" text-anchor="middle" font-size="10" fill="#e0f2fe">send_webhook_task</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- CORE ENGINE (below API) -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="310" y="390" width="200" height="75" rx="10" fill="#fff" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="410" y="412" text-anchor="middle" font-size="12" font-weight="700" fill="#4338ca">🔐 Signing Engine</text>
  <text x="410" y="430" text-anchor="middle" font-size="10" fill="#4f46e5">RSA · ECDSA · PKCS1v15</text>
  <text x="410" y="445" text-anchor="middle" font-size="10" fill="#4f46e5">SHA-256 / 384 / 512</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- DATA STORES (bottom row) -->
  <!-- ═══════════════════════════════════════════════════ -->
  <!-- PostgreSQL -->
  <rect x="130" y="530" width="190" height="80" rx="10" fill="#fff" stroke="#6ee7b7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="225" y="554" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">🐘 PostgreSQL</text>
  <text x="225" y="572" text-anchor="middle" font-size="10" fill="#047857">Users · Teams · Jobs</text>
  <text x="225" y="587" text-anchor="middle" font-size="10" fill="#047857">Audit Logs · Webhooks</text>

  <!-- Redis -->
  <rect x="350" y="530" width="160" height="80" rx="10" fill="#fff" stroke="#fca5a5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="430" y="554" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">⚡ Redis</text>
  <text x="430" y="572" text-anchor="middle" font-size="10" fill="#b91c1c">Celery broker :6379/1</text>
  <text x="430" y="587" text-anchor="middle" font-size="10" fill="#b91c1c">Result backend :6379/2</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- CERTIFICATE STORE (right column) -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="800" y="80" width="280" height="360" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="800" y="80" width="280" height="32" rx="10" fill="#fefce8"/>
  <rect x="800" y="100" width="280" height="12" fill="#fefce8"/>
  <text x="940" y="101" text-anchor="middle" font-size="11" font-weight="600" fill="#713f12" letter-spacing="1">CERTIFICATE STORE</text>

  <!-- Local -->
  <rect x="816" y="124" width="248" height="62" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="940" y="147" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">📁 Local Filesystem</text>
  <text x="940" y="165" text-anchor="middle" font-size="10" fill="#15803d">certs/*.pem · dev / snow-test</text>

  <!-- HashiCorp Vault -->
  <rect x="816" y="198" width="248" height="62" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="940" y="221" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">🔒 HashiCorp Vault</text>
  <text x="940" y="239" text-anchor="middle" font-size="10" fill="#b45309">KV secrets · AppRole auth</text>

  <!-- AWS KMS -->
  <rect x="816" y="272" width="248" height="62" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="940" y="295" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">☁  AWS KMS</text>
  <text x="940" y="313" text-anchor="middle" font-size="10" fill="#c2410c">Customer-managed keys</text>

  <!-- Azure Key Vault -->
  <rect x="816" y="346" width="248" height="62" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="940" y="369" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">☁  Azure Key Vault</text>
  <text x="940" y="387" text-anchor="middle" font-size="10" fill="#1d4ed8">DefaultAzureCredential</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- MONITORING (bottom right) -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="800" y="460" width="130" height="65" rx="8" fill="#fff" stroke="#c4b5fd" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="865" y="482" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">📈 Prometheus</text>
  <text x="865" y="498" text-anchor="middle" font-size="9" fill="#6d28d9">metrics · :9090</text>
  <text x="865" y="512" text-anchor="middle" font-size="9" fill="#6d28d9">Grafana · :3001</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- ARROWS -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- SNOW → API (sync, green) -->
  <line x1="214" y1="165" x2="308" y2="245" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" stroke-dasharray="0"/>
  <rect x="225" y="188" width="76" height="16" rx="4" fill="#dcfce7"/>
  <text x="263" y="200" text-anchor="middle" font-size="9" fill="#166534" font-weight="600">POST /snow/sign</text>

  <!-- API → SNOW response -->
  <line x1="308" y1="255" x2="214" y2="175" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)" stroke-dasharray="5,3"/>
  <rect x="222" y="207" width="82" height="14" rx="4" fill="#dcfce7"/>
  <text x="263" y="218" text-anchor="middle" font-size="9" fill="#166534">200 + signed_b64</text>

  <!-- CI/CD → API (blue) -->
  <line x1="214" y1="268" x2="308" y2="280" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="222" y="258" width="68" height="14" rx="4" fill="#dbeafe"/>
  <text x="256" y="269" text-anchor="middle" font-size="9" fill="#1e40af" font-weight="600">POST /sign</text>

  <!-- API → CI/CD response -->
  <line x1="308" y1="292" x2="214" y2="280" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)" stroke-dasharray="5,3"/>
  <rect x="218" y="280" width="82" height="14" rx="4" fill="#dbeafe"/>
  <text x="259" y="291" text-anchor="middle" font-size="9" fill="#1e40af">202 + job_id</text>

  <!-- CLI → API -->
  <line x1="214" y1="360" x2="308" y2="330" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Dashboard → API -->
  <line x1="214" y1="422" x2="308" y2="350" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

  <!-- API → Celery Worker -->
  <line x1="510" y1="250" x2="588" y2="238" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="524" y="237" width="54" height="14" rx="3" fill="#f1f5f9"/>
  <text x="551" y="248" text-anchor="middle" font-size="9" fill="#334155">enqueue</text>

  <!-- Worker → API result -->
  <line x1="588" y1="252" x2="510" y2="262" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <rect x="518" y="253" width="56" height="13" rx="3" fill="#f1f5f9"/>
  <text x="546" y="263" text-anchor="middle" font-size="9" fill="#334155">result</text>

  <!-- API → Signing Engine -->
  <line x1="410" y1="350" x2="410" y2="388" stroke="#6366f1" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Worker → Signing Engine -->
  <line x1="630" y1="300" x2="490" y2="420" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>

  <!-- API → PostgreSQL -->
  <line x1="380" y1="350" x2="280" y2="528" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

  <!-- API → Redis -->
  <line x1="430" y1="350" x2="430" y2="528" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

  <!-- Worker → Redis -->
  <line x1="620" y1="300" x2="510" y2="530" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

  <!-- Signing Engine → Cert Store -->
  <line x1="510" y1="428" x2="798" y2="300" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="610" y="352" width="90" height="16" rx="4" fill="#fef9c3"/>
  <text x="655" y="364" text-anchor="middle" font-size="9" fill="#92400e" font-weight="600">get_certificate()</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- FLOW LABELS -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="20" y="456" width="210" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="125" y="474" text-anchor="middle" font-size="9" fill="#475569" font-weight="600">SYNC FLOW (SNOW)</text>
  <text x="125" y="488" text-anchor="middle" font-size="9" fill="#475569">sign → 200 OK in single HTTP call</text>
  <text x="125" y="499" text-anchor="middle" font-size="9" fill="#475569">no polling required</text>

  <!-- ASYNC FLOW label -->
  <rect x="590" y="320" width="180" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="680" y="339" text-anchor="middle" font-size="9" fill="#475569" font-weight="600">ASYNC FLOW (CI/CD)</text>
  <text x="680" y="353" text-anchor="middle" font-size="9" fill="#475569">sign → 202 + job_id</text>
  <text x="680" y="365" text-anchor="middle" font-size="9" fill="#475569">poll GET /status/{job_id}</text>

  <!-- Footer -->
  <text x="550" y="700" text-anchor="middle" font-size="10" fill="#94a3b8">FastAPI · Celery · PostgreSQL · Redis · X.509 RSA/ECDSA · JWT + API Key · RBAC · Docker</text>
</svg>