name: "Sign VBA Macro"
description: "Sign a VBA macro file using the Macro Sign Service"
branding:
  icon: "lock"
  color: "blue"

inputs:
  service-url:
    description: "URL of the Macro Sign Service"
    required: true
  api-key:
    description: "API key for authentication"
    required: true
  file-path:
    description: "Path to the macro file to sign"
    required: true
  profile:
    description: "Signing profile to use"
    required: false
    default: ""
  algorithm:
    description: "Hash algorithm (sha256, sha384, sha512)"
    required: false
    default: "sha256"
  wait-for-completion:
    description: "Wait for signing to complete"
    required: false
    default: "true"
  timeout:
    description: "Timeout in seconds when waiting"
    required: false
    default: "120"

outputs:
  job-id:
    description: "The signing job ID"
    value: ${{ steps.sign.outputs.job_id }}
  status:
    description: "The signing job status"
    value: ${{ steps.result.outputs.status }}
  signature:
    description: "The digital signature (hex)"
    value: ${{ steps.result.outputs.signature }}
  file-hash:
    description: "The file hash"
    value: ${{ steps.result.outputs.file_hash }}

runs:
  using: "composite"
  steps:
    - name: Submit macro for signing
      id: sign
      shell: bash
      run: |
        RESPONSE=$(curl -s -w "\n%{http_code}" \
          -X POST "${{ inputs.service-url }}/api/v1/sign" \
          -H "X-API-Key: ${{ inputs.api-key }}" \
          -F "file=@${{ inputs.file-path }}" \
          -F "profile=${{ inputs.profile }}" \
          -F "algorithm=${{ inputs.algorithm }}")

        HTTP_CODE=$(echo "$RESPONSE" | tail -1)
        BODY=$(echo "$RESPONSE" | head -n -1)

        if [ "$HTTP_CODE" != "202" ]; then
          echo "::error::Signing request failed with HTTP $HTTP_CODE: $BODY"
          exit 1
        fi

        JOB_ID=$(echo "$BODY" | jq -r '.job_id')
        echo "job_id=$JOB_ID" >> $GITHUB_OUTPUT
        echo "::notice::Signing job submitted: $JOB_ID"

    - name: Wait for signing completion
      id: result
      if: inputs.wait-for-completion == 'true'
      shell: bash
      run: |
        JOB_ID="${{ steps.sign.outputs.job_id }}"
        TIMEOUT=${{ inputs.timeout }}
        ELAPSED=0
        INTERVAL=5

        while [ $ELAPSED -lt $TIMEOUT ]; do
          RESPONSE=$(curl -s \
            "${{ inputs.service-url }}/api/v1/status/$JOB_ID" \
            -H "X-API-Key: ${{ inputs.api-key }}")

          STATUS=$(echo "$RESPONSE" | jq -r '.status')

          if [ "$STATUS" = "completed" ]; then
            SIGNATURE=$(echo "$RESPONSE" | jq -r '.signature')
            FILE_HASH=$(echo "$RESPONSE" | jq -r '.file_hash')

            echo "status=completed" >> $GITHUB_OUTPUT
            echo "signature=$SIGNATURE" >> $GITHUB_OUTPUT
            echo "file_hash=$FILE_HASH" >> $GITHUB_OUTPUT
            echo "::notice::Macro signed successfully!"
            exit 0
          elif [ "$STATUS" = "failed" ]; then
            ERROR=$(echo "$RESPONSE" | jq -r '.error_message')
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "::error::Signing failed: $ERROR"
            exit 1
          fi

          echo "Status: $STATUS - waiting... ($ELAPSED/$TIMEOUT seconds)"
          sleep $INTERVAL
          ELAPSED=$((ELAPSED + INTERVAL))
        done

        echo "status=timeout" >> $GITHUB_OUTPUT
        echo "::error::Signing timed out after ${TIMEOUT}s"
        exit 1
